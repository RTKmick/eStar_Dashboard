<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>店內 POS 系統</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* (這裡請貼上之前給您的 CSS 樣式，為了版面簡潔我先省略) */
        /* ... CSS ... */
        body { font-family: sans-serif; padding: 20px; background: #f2f2f7; }
        .loading { color: gray; text-align: center; margin-top: 20px; }
        /* 簡單示意樣式 */
        .sidebar { float: left; width: 30%; background: white; height: 90vh; overflow-y: scroll; }
        .main-content { float: right; width: 68%; }
        .customer-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .customer-item:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <div class="sidebar">
      <div style="padding:10px; font-weight:bold; background:#eee;">
        今日 KIOSK 客戶
        <button onclick="loadTodayCustomers()" style="float:right;">刷新</button>
      </div>
      <div id="customerList" class="loading">載入中...</div>
    </div>

    <div class="main-content">
        <h2>當前客戶：<span id="currentCustomerDisplay">尚未選擇</span></h2>
        <p>測試模式：請點選左側客戶，或使用下方按鈕。</p>
        </div>

<script>
    // ==========================================
    // ⚠️ 設定區：請填入您的 Apps Script 網址
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/您的發布網址/exec"; 

    // 通用的 API 呼叫函式
    function callApi(action, data = {}) {
        // 使用 POST 方式呼叫 Apps Script
        return fetch(GAS_API_URL, {
            method: "POST",
            mode: "cors", // 跨網域
            body: JSON.stringify({
                action: action,
                data: data
            })
        })
        .then(response => response.json())
        .then(result => {
            if (result.error) throw new Error(result.error);
            return result;
        })
        .catch(err => {
            alert("連線錯誤：" + err.message);
            console.error(err);
        });
    }

    // 功能 1: 載入今日客戶
    function loadTodayCustomers() {
        document.getElementById('customerList').innerHTML = '載入中...';
        
        callApi('getTodayRawData') // 呼叫 Code.gs 的新函式
            .then(data => {
                const listEl = document.getElementById('customerList');
                listEl.innerHTML = '';
                
                if (data.length === 0) {
                    listEl.innerHTML = '<div style="padding:10px;">目前尚無資料</div>';
                    return;
                }

                data.forEach(cust => {
                    const div = document.createElement('div');
                    div.className = 'customer-item';
                    div.innerHTML = `
                        <div style="font-weight:bold;">${cust.phone}</div>
                        <div style="font-size:0.8em; color:#666;">${cust.time} - ${cust.name || '未填寫'}</div>
                    `;
                    div.onclick = () => selectCustomer(cust);
                    listEl.appendChild(div);
                });
            });
    }

    // 功能 2: 選擇客戶
    function selectCustomer(cust) {
        document.getElementById('currentCustomerDisplay').innerText = `${cust.name} (${cust.phone})`;
        // 這裡可以接著寫自動帶入購物車的邏輯
    }

    // 頁面載入時自動執行
    window.onload = loadTodayCustomers;

</script>
</body>
</html>
