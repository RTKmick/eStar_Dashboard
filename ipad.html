<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>eStar POS 系統</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="config.js"></script>

    <style>
      /* --- 全局設定 --- */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        background-color: #1c1c1e; /* 深色背景更顯現代感 */
        margin: 0; padding: 0;
        height: 100vh; display: flex; overflow: hidden;
        color: #fff;
      }

      /* ========================================= */
      /* 1. 左欄：今日客戶列表 (固定寬度 260px)    */
      /* ========================================= */
      .sidebar {
        width: 260px; 
        background-color: #2c2c2e; 
        border-right: 1px solid #3a3a3c;
        display: flex; flex-direction: column; height: 100%;
        z-index: 10;
      }
      .sidebar-header {
        padding: 15px; background-color: #3a3a3c; font-weight: bold; border-bottom: 1px solid #48484a;
        display: flex; justify-content: space-between; align-items: center;
        color: #fff;
      }
      .refresh-btn {
        background: #0a84ff; border: none; color: white; border-radius: 6px;
        padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: bold;
      }
      .customer-list { overflow-y: auto; flex: 1; }
      
      .customer-item {
        padding: 15px; border-bottom: 1px solid #3a3a3c; cursor: pointer;
        transition: background 0.2s; background: #2c2c2e; color: #fff;
      }
      .customer-item:active { background-color: #3a3a3c; }
      /* 選中狀態：發光藍 */
      .customer-item.selected { 
        background: linear-gradient(90deg, #0a84ff, #0056b3); 
        color: white; border-left: 4px solid #66b2ff;
      }
      .customer-phone { font-weight: bold; font-size: 1.1em; letter-spacing: 0.5px; }
      .customer-time { font-size: 0.85em; color: #aeaeb2; margin-top: 4px; }
      .customer-item.selected .customer-time { color: #e0e0e0; }
      .loading-text { text-align: center; color: #8e8e93; padding: 20px; }

      /* ========================================= */
      /* 2. 中欄：商品按鈕區 (現代化風格)           */
      /* ========================================= */
      .middle-content {
        flex: 1; 
        display: flex; flex-direction: column; 
        padding: 12px;
        background-color: #1c1c1e;
        height: 100%; box-sizing: border-box;
      }

      /* 頂部資訊列 (包含手動輸入) */
      .current-customer-bar {
        background: #2c2c2e; color: white; padding: 12px 15px; border-radius: 12px;
        margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        border: 1px solid #3a3a3c;
      }
      .customer-info-area { display: flex; align-items: center; gap: 10px; }
      
      /* 按鈕群組 */
      .action-buttons { display: flex; gap: 8px; }
      
      .action-btn {
        border: none; border-radius: 8px; padding: 8px 16px; font-weight: bold; cursor: pointer;
        font-size: 14px; transition: transform 0.1s;
      }
      .action-btn:active { transform: scale(0.95); }
      .btn-manual { background-color: #ff9f0a; color: white; } /* 橘色 */
      .btn-clear { background-color: #ff453a; color: white; } /* 紅色 */

      /* 商品 Grid (保持 4 欄) */
      .products-grid {
        display: grid; 
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 100px; /* 固定高度 */
        gap: 10px;
        overflow-y: auto;
        align-content: start;
        padding-bottom: 20px;
      }

      /* === 現代化按鈕樣式 === */
      .product-btn {
        border: none; border-radius: 12px;
        padding: 10px; position: relative; cursor: pointer; 
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        /* 立體光影 */
        box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
        transition: all 0.1s ease;
        border: 1px solid rgba(0,0,0,0.1);
      }
      /* 按下效果：縮小 + 陰影變淺 */
      .product-btn:active { 
        transform: scale(0.96) translateY(2px); 
        box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      }

      .product-name { 
        font-size: 19px; font-weight: 700; color: white; 
        text-align: center; line-height: 1.2; margin-bottom: 18px; 
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      }
      .product-price { 
        position: absolute; bottom: 8px; right: 10px; 
        font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.9);
      }

      /* === 顏色漸層 (Gradient) === */
      /* 藍色系 (洗衣) */
      .grad-blue { background: linear-gradient(145deg, #007aff, #0056b3); }
      
      /* 紅色系 (烘衣) */
      .grad-red { background: linear-gradient(145deg, #ff453a, #c02a21); }
      
      /* 紫色系 (商品) */
      .grad-purple { background: linear-gradient(145deg, #bf5af2, #8930b8); }
      
      /* 綠色系 (服務) */
      .grad-green { background: linear-gradient(145deg, #32d74b, #248a32); }

      /* ========================================= */
      /* 3. 右欄：收據預覽區 (紙張質感)             */
      /* ========================================= */
      .right-panel {
        width: 320px;
        background-color: #f2f2f7; /* 淺灰背景 */
        display: flex; flex-direction: column;
        height: 100%;
        border-left: 1px solid #3a3a3c;
      }

      .receipt-preview-header {
        background: #fff; padding: 15px; border-bottom: 1px solid #d1d1d6;
        text-align: center; font-weight: bold; font-size: 1.1em; color: #000;
      }
      
      .cart-list {
        flex: 1; overflow-y: auto; padding: 10px;
        font-family: 'Courier New', monospace; 
        background: #fff; margin: 10px; border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      }
      
      .cart-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 0; border-bottom: 1px dashed #ccc; font-size: 15px; color: #333;
      }
      .cart-item-name { flex: 1; }
      .cart-item-price { font-weight: bold; margin-right: 10px; }
      .btn-remove { 
        color: #ff3b30; cursor: pointer; font-size: 18px; padding: 0 8px; text-decoration: none;
      }

      .checkout-footer {
        padding: 20px; background: #fff; border-top: 1px solid #d1d1d6;
      }
      .total-row {
        display: flex; justify-content: space-between; font-size: 1.6em; font-weight: bold; margin-bottom: 15px; color: #000;
      }
      .print-btn {
        width: 100%; background-color: #000; color: white;
        border: none; padding: 16px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      }
      .print-btn:active { transform: scale(0.98); background-color: #333; }

      /* ========================================= */
      /* 🖨️ 列印樣式 (保持不變，針對 80mm 優化)    */
      /* ========================================= */
      @media print {
        @page { size: 80mm auto; margin: 0; }
        body * { visibility: hidden; height: 0; overflow: hidden; }
        .sidebar, .middle-content, .right-panel { display: none !important; }

        #receipt-area, #receipt-area * { visibility: visible; height: auto; }
        #receipt-area {
          position: absolute; left: 0; top: 0; width: 72mm;
          padding: 5px; margin: 0; color: black; background: white;
          font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.4;
          display: block !important;
        }
        .receipt-header { text-align: center; margin-bottom: 10px; }
        .receipt-divider { border-top: 1px dashed #000; margin: 5px 0; }
        .receipt-item { display: flex; justify-content: space-between; }
        .receipt-total { font-size: 1.5em; font-weight: bold; text-align: right; margin-top: 10px; }
        .receipt-feed { height: 30px; } 
      }
      #receipt-area { display: none; }

    </style>
</head>
<body>

    <div class="sidebar">
      <div class="sidebar-header">
        KIOSK 客戶
        <button class="refresh-btn" onclick="loadTodayCustomers()">刷新</button>
      </div>
      <div class="customer-list" id="customerList">
        <div class="loading-text">載入中...</div>
      </div>
    </div>

    <div class="middle-content">
      
      <div class="current-customer-bar">
        <div class="customer-info-area">
            <span style="color:#8e8e93; font-size:0.9em;">當前：</span>
            <span id="currentCustomerDisplay" style="font-size:1.1em; font-weight:bold;">現場客</span>
        </div>
        <div class="action-buttons">
            <button class="action-btn btn-manual" onclick="manualInput()">✎ 手動輸入</button>
            <button class="action-btn btn-clear" onclick="clearOrder()">✕ 清空</button>
        </div>
      </div>

      <div class="products-grid">
        <button class="product-btn grad-blue" onclick="addToCart('洗衣-40(小)', 40)">
            <span class="product-name">洗衣-40<br>(小)</span><span class="product-price">$40</span>
        </button>
        <button class="product-btn grad-blue" onclick="addToCart('洗衣-70(小)', 70)">
            <span class="product-name">洗衣-70<br>(小)</span><span class="product-price">$70</span>
        </button>
        <button class="product-btn grad-blue" onclick="addToCart('洗衣-100(中)', 100)">
            <span class="product-name">洗衣-100<br>(中)</span><span class="product-price">$100</span>
        </button>
        <button class="product-btn grad-blue" onclick="addToCart('洗衣-130(大)', 130)">
            <span class="product-name">洗衣-130<br>(大)</span><span class="product-price">$130</span>
        </button>

        <button class="product-btn grad-red" onclick="addToCart('烘衣 10元', 10)">
            <span class="product-name">烘衣 10元</span><span class="product-price">$10</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 20元', 20)">
            <span class="product-name">烘衣 20元</span><span class="product-price">$20</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 40元', 40)">
            <span class="product-name">烘衣 40元</span><span class="product-price">$40</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 60元', 60)">
            <span class="product-name">烘衣 60元</span><span class="product-price">$60</span>
        </button>

        <button class="product-btn grad-red" onclick="addToCart('烘衣 80元', 80)">
            <span class="product-name">烘衣 80元</span><span class="product-price">$80</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 100元', 100)">
            <span class="product-name">烘衣 100元</span><span class="product-price">$100</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 120元', 120)">
            <span class="product-name">烘衣 120元</span><span class="product-price">$120</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 140元', 140)">
            <span class="product-name">烘衣 140元</span><span class="product-price">$140</span>
        </button>

        <button class="product-btn grad-purple" onclick="addToCart('加洗劑', 10)">
            <span class="product-name">加洗劑 10</span><span class="product-price">$10</span>
        </button>
        <button class="product-btn grad-purple" onclick="addToCart('靜電香紙', 10)">
            <span class="product-name">靜電香紙 10</span><span class="product-price">$10</span>
        </button>
        <button class="product-btn grad-purple" onclick="addToCart('裝衣袋', 10)">
            <span class="product-name">裝衣袋 10</span><span class="product-price">$10</span>
        </button>
        <button class="product-btn grad-purple" onclick="addToCart('洗衣豆', 30)">
            <span class="product-name">洗衣豆 30</span><span class="product-price">$30</span>
        </button>

        <button class="product-btn grad-green" onclick="addToCart('代摺費用', 20)">
            <span class="product-name">代摺費用</span><span class="product-price">$20</span>
        </button>
      </div>
    </div>

    <div class="right-panel">
        <div class="receipt-preview-header">單據預覽</div>
        
        <div class="cart-list" id="cartList">
            <div style="text-align:center; color:#999; margin-top:50px;">
                尚未加入項目<br>請點選左側商品
            </div>
        </div>

        <div class="checkout-footer">
            <div class="total-row">
                <span>總計</span>
                <span style="color:#007aff;">$<span id="totalPrice">0</span></span>
            </div>
            <button class="print-btn" onclick="printReceipt()">確認並列印</button>
        </div>
    </div>

    <div id="receipt-area">
      <div class="receipt-header">
        <h2 style="font-size:1.5em; font-weight:bold; margin:0;">eStar 衣洗淨</h2>
        <div>訂單收據</div>
      </div>
      <div class="receipt-divider"></div>
      <div>時間: <span id="printTime"></span></div>
      <div>客戶: <span id="printCustomer"></span></div>
      <div class="receipt-divider"></div>
      <div id="printItems"></div>
      <div class="receipt-divider"></div>
      <div class="receipt-total">總計: $<span id="printTotal"></span></div>
      <div style="text-align:center; margin-top:10px; font-size:12px;">
        <p>謝謝光臨！</p>
      </div>
      <br><br><div class="receipt-feed">.</div>
    </div>

    <script>
      // ==========================================
      if (typeof CONFIG === 'undefined' || !CONFIG.API_URL) {
          alert("錯誤：找不到設定檔 config.js！");
      }
      const GAS_API_URL = CONFIG.API_URL; 

      let currentCustomer = null;
      let cart = [];

      function callApi(action, data = {}) {
        return fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({ action: action, data: data })
        })
        .then(res => res.json())
        .then(result => {
            if(result.error) throw new Error(result.error);
            return result;
        })
        .catch(err => {
            console.error(err);
        });
      }

      function loadTodayCustomers() {
        const listEl = document.getElementById('customerList');
        listEl.innerHTML = '<div class="loading-text">載入中...</div>';
        
        callApi('getTodayRawData')
          .then(data => {
             listEl.innerHTML = '';
             if (!data || data.length === 0) {
               listEl.innerHTML = '<div class="loading-text">今日尚無 KIOSK 資料</div>';
               return;
             }
             data.forEach(cust => {
               const div = document.createElement('div');
               div.className = 'customer-item';
               div.innerHTML = `
                 <div class="customer-phone">${cust.phone}</div>
                 <div class="customer-time">${cust.time} - ${cust.name || '未填寫'}</div>
               `;
               div.onclick = () => selectCustomer(cust, div);
               listEl.appendChild(div);
             });
          });
      }

      function selectCustomer(cust, element) {
        currentCustomer = cust;
        document.getElementById('currentCustomerDisplay').innerText = `${cust.name || '未填寫'} (${cust.phone})`;
        document.querySelectorAll('.customer-item').forEach(el => el.classList.remove('selected'));
        if(element) element.classList.add('selected');
      }

      // === 新增：手動輸入功能 ===
      function manualInput() {
        const input = prompt("請輸入客戶手機或備註 (例如: 0912-345-678 張先生)", "");
        if (input && input.trim() !== "") {
            // 建立一個臨時客戶物件
            currentCustomer = {
                name: "手動輸入",
                phone: input.trim()
            };
            // 更新畫面
            document.getElementById('currentCustomerDisplay').innerText = input.trim();
            // 清除左側的選取狀態
            document.querySelectorAll('.customer-item').forEach(el => el.classList.remove('selected'));
        }
      }

      function addToCart(name, price) {
        cart.push({ name, price });
        renderCart();
      }

      function removeItem(index) {
        cart.splice(index, 1);
        renderCart();
      }

      function renderCart() {
        const container = document.getElementById('cartList');
        const totalEl = document.getElementById('totalPrice');
        
        if (cart.length === 0) {
          container.innerHTML = '<div style="text-align:center; color:#999; margin-top:50px;">尚未加入項目</div>';
          totalEl.innerText = '0';
          return;
        }

        let html = '';
        let total = 0;
        cart.forEach((item, index) => {
          total += item.price;
          html += `
            <div class="cart-item">
              <span class="cart-item-name">${item.name}</span>
              <span class="cart-item-price">$${item.price}</span>
              <a href="#" class="btn-remove" onclick="removeItem(${index})">✕</a>
            </div>
          `;
        });
        container.innerHTML = html;
        totalEl.innerText = total;
      }

      function clearOrder() {
        cart = [];
        currentCustomer = null;
        document.getElementById('currentCustomerDisplay').innerText = "現場客";
        document.querySelectorAll('.customer-item').forEach(el => el.classList.remove('selected'));
        renderCart();
      }

      function printReceipt() {
        if (cart.length === 0) {
          alert("購物車是空的！");
          return;
        }
        const now = new Date();
        document.getElementById('printTime').innerText = now.toLocaleString('zh-TW', {hour12:false});
        
        let customerText = "現場客";
        if (currentCustomer) {
            // 如果是手動輸入的，格式微調
            if (currentCustomer.name === "手動輸入") {
                customerText = currentCustomer.phone;
            } else {
                customerText = `${currentCustomer.name || ''} ${currentCustomer.phone}`;
            }
        }
        document.getElementById('printCustomer').innerText = customerText;
        
        let itemsHtml = '';
        let total = 0;
        cart.forEach(item => {
          total += item.price;
          itemsHtml += `
            <div class="receipt-item">
                <span>${item.name}</span>
                <span>$${item.price}</span>
            </div>`;
        });
        document.getElementById('printItems').innerHTML = itemsHtml;
        document.getElementById('printTotal').innerText = total;

        window.print();
      }

      window.onload = loadTodayCustomers;
    </script>
</body>
</html>
