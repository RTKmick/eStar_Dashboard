<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>eStar POS 系統</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="config.js"></script>

<style>
      /* --- 全局設定 --- */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        background-color: #1c1c1e;
        margin: 0; padding: 0;
        /* 關鍵：使用 dvh 解決 iPad 網址列遮擋問題 */
        height: 100vh; 
        height: 100dvh; 
        display: flex; overflow: hidden;
        color: #fff;
        /* 禁止選取文字，讓 App 更有原生感 */
        -webkit-user-select: none; user-select: none;
      }

      /* 通用：優化 iOS 滑動手感 */
      .customer-list, .products-grid, .badges-container, .cart-list {
        -webkit-overflow-scrolling: touch;
      }

      /* 左欄：列表 */
      .sidebar {
        width: 260px; 
        background-color: #2c2c2e; 
        border-right: 1px solid #3a3a3c;
        display: flex; flex-direction: column; height: 100%;
        z-index: 10;
        flex-shrink: 0; /* 防止被壓縮 */
      }
      .sidebar-header {
        padding: 15px; background-color: #3a3a3c; font-weight: bold; border-bottom: 1px solid #48484a;
        display: flex; justify-content: space-between; align-items: center;
        color: #fff;
      }
      .refresh-btn {
        background: #0a84ff; border: none; color: white; border-radius: 6px;
        padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: bold;
      }
      .customer-list { overflow-y: auto; flex: 1; }
      
      .customer-item {
        padding: 15px; border-bottom: 1px solid #3a3a3c; cursor: pointer;
        transition: background 0.2s; background: #2c2c2e; color: #fff;
      }
      .customer-item:active { background-color: #3a3a3c; }
      .customer-item.selected { 
        background: linear-gradient(90deg, #0a84ff, #0056b3); 
        color: white; border-left: 4px solid #66b2ff;
      }
      .customer-phone { font-weight: bold; font-size: 1.1em; letter-spacing: 0.5px; }
      .customer-time { font-size: 0.85em; color: #aeaeb2; margin-top: 4px; }
      .customer-item.selected .customer-time { color: #e0e0e0; }
      .loading-text { text-align: center; color: #8e8e93; padding: 20px; }

      /* 中欄：操作區 */
      .middle-content {
        flex: 1; 
        display: flex; flex-direction: column; 
        padding: 12px;
        background-color: #1c1c1e;
        height: 100%; box-sizing: border-box;
        overflow: hidden; 
        min-width: 0; /* 防止 Grid 撐開 Flex */
      }

      .current-customer-bar {
        background: #2c2c2e; color: white; padding: 12px 15px; border-radius: 12px;
        margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        border: 1px solid #3a3a3c;
        flex-shrink: 0; 
      }
      .customer-info-area { display: flex; align-items: center; gap: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .action-buttons { display: flex; gap: 8px; flex-shrink: 0;}
      .action-btn {
        border: none; border-radius: 8px; padding: 8px 16px; font-weight: bold; cursor: pointer;
        font-size: 14px; transition: transform 0.1s;
      }
      .action-btn:active { transform: scale(0.95); }
      .btn-manual { background-color: #ff9f0a; color: white; }
      .btn-clear { background-color: #ff453a; color: white; }

      /* 按鈕 Grid (優化：自適應寬度，不再固定 4 欄) */
      .products-grid {
        display: grid; 
        /* 最小寬度 85px，自動填滿，解決直向太擠問題 */
        grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
        grid-auto-rows: 90px; 
        gap: 8px;
        overflow-y: auto;
        align-content: start;
        margin-bottom: 10px;
        flex-grow: 1; 
      }

      .product-btn {
        border: none; border-radius: 12px; padding: 4px; 
        position: relative; cursor: pointer; 
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
        transition: all 0.1s ease; border: 1px solid rgba(0,0,0,0.1);
        /* 避免雙擊縮放 */
        touch-action: manipulation;
      }
      .product-btn:active { transform: scale(0.96) translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
      
      .p-title { 
        font-size: 18px; /* 稍微縮小適應 iPad 直向 */
        font-weight: 800; color: white; 
        text-align: center; line-height: 1.1; 
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      }
      .p-sub {
        font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.9);
        margin-top: 2px;
      }

      .grad-blue { background: linear-gradient(145deg, #007aff, #0056b3); }
      .grad-red { background: linear-gradient(145deg, #ff453a, #c02a21); }
      .grad-purple { background: linear-gradient(145deg, #bf5af2, #8930b8); }
      .grad-green { background: linear-gradient(145deg, #32d74b, #248a32); }

      /* 下方儀表板 */
      .info-panel {
        background-color: #2c2c2e;
        border-top: 1px solid #3a3a3c;
        border-radius: 12px;
        padding: 12px;
        min-height: 140px; 
        display: flex;
        flex-direction: column;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
        flex-shrink: 0;
      }
      .info-panel-title {
        font-size: 12px; color: #8e8e93; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px;
      }
      .badges-container {
        display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
        overflow-y: auto;
      }

      .info-badge {
        display: inline-flex; align-items: center;
        border: 1px solid #48484a;
        padding: 6px 10px; /* 稍微縮小 padding */
        border-radius: 8px;
        font-size: 14px; color: #fff; transition: all 0.2s;
      }
      .badge-label { color: #aaa; margin-right: 6px; font-size: 0.85em; font-weight: normal; }
      .badge-value { font-weight: bold; color: #fff; }

      /* 特殊狀態配色 */
      .badge-active { background: rgba(48, 209, 88, 0.2); border-color: #30d158; color: #30d158; box-shadow: 0 0 5px rgba(48, 209, 88, 0.2); }
      .badge-dim { opacity: 0.5; border-color: #444; background: #2c2c2e; }
      .badge-dim .badge-value { color: #999; font-weight: normal; }
      .badge-id { background: rgba(10, 132, 255, 0.2); border-color: #0a84ff; color: #66b2ff; font-size: 1.1em; }
      .badge-id .badge-value { color: #fff; text-shadow: 0 0 5px #0a84ff; }
      .badge-vip { background: rgba(255, 214, 10, 0.15); border-color: #ffd60a; color: #ffd60a; }
      .badge-alert { background: rgba(255, 69, 58, 0.2); border-color: #ff453a; color: #ff453a; }
      .badge-warn { background: rgba(255, 159, 10, 0.15); border-color: #ff9f0a; color: #ff9f0a; }

      /* 右欄：結帳 */
      .right-panel {
        width: 320px;
        background-color: #f2f2f7; 
        display: flex; flex-direction: column;
        height: 100%;
        border-left: 1px solid #3a3a3c;
        flex-shrink: 0;
      }
      .receipt-preview-header {
        background: #fff; padding: 15px; border-bottom: 1px solid #d1d1d6;
        text-align: center; font-weight: bold; font-size: 1.1em; color: #000;
      }
      .cart-list {
        flex: 1; overflow-y: auto; padding: 10px;
        font-family: 'Courier New', monospace; 
        background: #fff; margin: 10px; border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      }
      .cart-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 0; border-bottom: 1px dashed #ccc; font-size: 15px; color: #333;
      }
      .cart-item-name { flex: 1; }
      .cart-item-price { font-weight: bold; margin-right: 10px; }
      .btn-remove { 
        color: #ff3b30; cursor: pointer; font-size: 18px; padding: 0 8px; text-decoration: none;
      }
      .checkout-footer {
        padding: 20px; background: #fff; border-top: 1px solid #d1d1d6;
        /* iPad 下方保留安全距離 */
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }
      .total-row {
        display: flex; justify-content: space-between; font-size: 1.6em; font-weight: bold; margin-bottom: 15px; color: #000;
      }
      .print-btn {
        width: 100%; background-color: #000; color: white;
        border: none; padding: 16px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      }
      .print-btn:active { transform: scale(0.98); background-color: #333; }

      /* === iPad 響應式調整 (關鍵新增) === */
      @media (max-width: 1024px) {
        .sidebar { width: 220px; } /* 縮小左側 */
        .right-panel { width: 280px; } /* 縮小右側 */
        .p-title { font-size: 16px; } /* 字體微調 */
      }
      
      @media (max-width: 820px) { /* iPad 直向模式 */
        .sidebar { width: 200px; }
        .right-panel { width: 260px; }
        .customer-phone { font-size: 1em; }
        .action-btn { padding: 6px 10px; }
      }

      /* --- 列印專用樣式 (維持不變) --- */
      @media print {
        @page { size: 80mm auto; margin: 0; }
        body * { visibility: hidden; height: 0; overflow: hidden; }
        .sidebar, .middle-content, .right-panel { display: none !important; }
        #receipt-area, #receipt-area * { visibility: visible; height: auto; }
        #receipt-area {
          position: absolute; left: 0; top: 0; width: 72mm;
          padding: 5px; margin: 0; 
          color: black; background: white;
          font-family: 'Courier New', Courier, monospace;
          font-size: 14px; line-height: 1.4;
          display: block !important;
        }
        .r-header { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .r-dashed { border-top: 1px dashed #000; margin: 5px 0; }
        .r-info { font-size: 14px; line-height: 1.4; margin-bottom: 5px; }
        .r-item { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .r-total-box { text-align: right; margin: 10px 0; }
        .r-total-text { font-size: 24px; font-weight: 800; }
        .r-footer { text-align: left; margin-top: 10px; line-height: 1.6; }
        .r-checkbox { display: inline-block; font-size: 18px; vertical-align: middle; margin-left: 5px;}
        .r-feed { height: 30px; } 
      }
      #receipt-area { display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
      <div class="sidebar-header">
        KIOSK 客戶
        <button class="refresh-btn" onclick="loadTodayCustomers()">刷新</button>
      </div>
      <div class="customer-list" id="customerList">
        <div class="loading-text">載入中...</div>
      </div>
    </div>

    <div class="middle-content">
      
      <div class="current-customer-bar">
        <div class="customer-info-area">
            <span style="color:#8e8e93; font-size:0.9em;">當前：</span>
            <span id="currentCustomerDisplay" style="font-size:1.1em; font-weight:bold;">現場客</span>
        </div>
        <div class="action-buttons">
            <button class="action-btn btn-manual" onclick="manualInput()">✎ 手動</button>
            <button class="action-btn btn-clear" onclick="clearOrder()">✕ 清空</button>
        </div>
      </div>

      <div class="products-grid">

        <button class="product-btn grad-blue" onclick="addToCart('洗衣(小)', 70)">

        </button>
        <button class="product-btn grad-blue" onclick="addToCart('洗衣(中)', 100)">
            <span class="p-title">洗衣 $100</span>

        </button>
        <button class="product-btn grad-blue" onclick="addToCart('洗衣(大)', 130)">

            <span class="p-sub">(大)</span>

        <button class="product-btn grad-red" onclick="addToCart('烘衣 10元', 10)">

        <button class="product-btn grad-red" onclick="addToCart('烘衣 20元', 20)">

        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 40元', 40)">
            <span class="p-title">烘衣 $40</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 60元', 60)">
            <span class="p-title">烘衣 $60</span>
        </button>

        <button class="product-btn grad-red" onclick="addToCart('烘衣 80元', 80)">
            <span class="p-title">烘衣 $80</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 100元', 100)">
            <span class="p-title">烘衣 $100</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 120元', 120)">
            <span class="p-title">烘衣 $120</span>
        </button>
        <button class="product-btn grad-red" onclick="addToCart('烘衣 140元', 140)">

      </div>

      <div class="info-panel">
        <div class="info-panel-title">客戶詳細資訊 (D~L欄)</div>

    </div>

    <div class="right-panel">
        <div class="receipt-preview-header">單據預覽</div>

      <div class="receipt-divider"></div>

    <script>
      // ==========================================
      // 檢查 config.js
      if (typeof CONFIG === 'undefined' || !CONFIG.API_URL) {
          alert("❌ 錯誤：Config.js 未正確載入！");
      }
      const GAS_API_URL = CONFIG.API_URL; 

      let currentCustomer = null;
      let cart = [];

      // API 核心
      function callApi(action, data = {}) {
        return fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({ action: action, data: data })
        })
        .then(res => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
        })
        .then(result => {
            if(result.error) throw new Error(result.error);
            return result;
        })
        .catch(err => {
            console.error("API Error:", err);
            alert("連線發生錯誤:\n" + err.message);
        });
      }

      function loadTodayCustomers() {
        const listEl = document.getElementById('customerList');
        listEl.innerHTML = '<div class="loading-text">資料載入中...</div>';
        
        callApi('getTodayRawData')
          .then(data => {
             listEl.innerHTML = '';
             if (!data || data.length === 0) {
               listEl.innerHTML = '<div class="loading-text">今日尚無 KIOSK 資料</div>';
               return;
             }
             data.forEach(cust => {
               const div = document.createElement('div');
               div.className = 'customer-item';
               div.innerHTML = `
                 <div class="customer-phone">${cust.phone}</div>
                 <div class="customer-time">${cust.time} - ${cust.name || '未填寫'}</div>
               `;
               div.onclick = () => selectCustomer(cust, div); 
               listEl.appendChild(div);
             });
          });
      }

      // ✅ 智慧燈號邏輯 (已修正：符合您的亮燈規則)
      function selectCustomer(cust, element) {
        currentCustomer = cust;
        document.getElementById('currentCustomerDisplay').innerText = `${cust.name || '未填寫'} (${cust.phone})`;
        document.querySelectorAll('.customer-item').forEach(el => el.classList.remove('selected'));
        if(element) element.classList.add('selected');

        const badgeContainer = document.getElementById('customerDetailBadges');
        badgeContainer.innerHTML = ''; 

        if (!cust.extraInfo || cust.extraInfo.length === 0) {
            badgeContainer.innerHTML = '<span style="color:#666; padding:10px; font-style:italic;">無詳細資料</span>';
            return;
        }

        let html = '';
        cust.extraInfo.forEach(info => {
            // 1. 取得原始文字
            let rawLabel = (info.label || "").toString().trim(); 
            let rawVal = (info.value || "").toString().trim();    
            
            // 2. 清理標題
            let label = rawLabel.replace(/[a-zA-Z\s]+/g, ''); 
            if(!label) label = rawLabel.split(' ')[0];

            // 3. 清理內容 (移除英文與不需要的後綴)
            let val = rawVal.replace(/Card/i, '')
                            .replace(/E-Pay/i, '')
                            .replace(/Cash/i, '')
                            .replace(/Default/i, '')
                            .replace(/Middle/i, '') // 補上 Middle
                            .replace(/High/i, '')
                            .replace(/Low/i, '')
                            .replace(/Zero/i, '')
                            .replace(/One/i, '')
                            .replace(/Two/i, '')
                            .replace(/Three/i, '')
                            .replace(/Y$/i, '')
                            .replace(/N$/i, '');

            // 4. 判斷燈號顏色
            // 預設全部為灰階 (badge-dim)
            let cssClass = 'info-badge badge-dim';
            
            // --- 依照您的規則判斷 ---

            // A. 付款方式 (現金、電子支付 -> 亮燈)
            if (label.includes("消費") || label.includes("Type")) {
                if (val.includes("現金") || val.includes("電子")) {
                    cssClass = 'info-badge badge-active'; // 綠燈
                } else if (val.includes("儲值")) {
                    cssClass = 'info-badge badge-vip';    // 儲值卡維持金燈 (比較尊榮)
                }
            }
            
            // B. 烘衣溫度 (低溫/高溫 -> 亮燈，中溫 -> 不亮)
            else if (label.includes("溫度") || label.includes("Temp")) {
                if (val.includes("低溫") || val.includes("高溫")) {
                    cssClass = 'info-badge badge-active';
                }
                // 中溫保持默認灰色
            }

            // C. 耗材 (烘衣紙/洗衣球) (1盒/2盒/3盒 -> 亮燈，不加 -> 不亮)
            else if (label.includes("烘衣紙") || label.includes("洗衣球") || label.includes("Sheet") || label.includes("Pods")) {
                if (val.includes("盒")) {
                    cssClass = 'info-badge badge-active';
                }
            }

            // D. 選項 (香香豆/卡放店內/特約) (是 -> 亮燈)
            else if (label.includes("香香豆") || label.includes("卡放") || label.includes("特約")) {
                if (val.includes("是")) {
                    // 卡放店內維持原本的橘色警示，或改綠色皆可，這裡設為亮燈
                    // 若要特別醒目，卡放店內可維持 badge-warn
                    if (label.includes("卡放")) cssClass = 'info-badge badge-warn';
                    else cssClass = 'info-badge badge-active';
                }
            }

            // E. 會員編號 (有值 -> 藍燈)
            else if (label.includes("編號") || label.includes("Number")) {
                if (val && val !== "否" && val !== "不加") cssClass = 'info-badge badge-id';
            }
            
            // F. 特別註明 (有值 -> 紅燈)
            else if (label.includes("註明") || label.includes("Note")) {
                if (val && val !== "無") cssClass = 'info-badge badge-alert';
            }

            html += `<div class="${cssClass}"><span class="badge-label">${label}:</span><span class="badge-value">${val}</span></div>`;
        });
        badgeContainer.innerHTML = html;
      }
        
      function manualInput() {
        const input = prompt("請輸入客戶手機或備註", "");
        if (input && input.trim() !== "") {
            currentCustomer = { name: "手動輸入", phone: input.trim() };
            document.getElementById('currentCustomerDisplay').innerText = input.trim();
            document.querySelectorAll('.customer-item').forEach(el => el.classList.remove('selected'));
            document.getElementById('customerDetailBadges').innerHTML = `<div class="info-badge badge-warn"><span class="badge-value">手動輸入模式</span></div>`;
        }
      }

      function clearOrder() {
        cart = [];
        currentCustomer = null;
        document.getElementById('currentCustomerDisplay').innerText = "現場客";
        document.querySelectorAll('.customer-item').forEach(el => el.classList.remove('selected'));
        document.getElementById('customerDetailBadges').innerHTML = '<span style="color:#555; font-size:14px; padding:10px;">尚未選擇客戶</span>';
        renderCart();
      }

      function addToCart(name, price) {
        cart.push({ name, price });
        renderCart();
      }

      function removeItem(index) {
        cart.splice(index, 1);
        renderCart();
      }

      function renderCart() {
        const container = document.getElementById('cartList');
        const totalEl = document.getElementById('totalPrice');
        if (cart.length === 0) {
          container.innerHTML = '<div style="text-align:center; color:#999; margin-top:50px;">尚未加入項目</div>';
          totalEl.innerText = '0';
          return;
        }
        let html = '';
        let total = 0;
        cart.forEach((item, index) => {
          total += item.price;
          html += `<div class="cart-item"><span class="cart-item-name">${item.name}</span><span class="cart-item-price">$${item.price}</span><a href="#" class="btn-remove" onclick="removeItem(${index})">✕</a></div>`;
        });
        container.innerHTML = html;
        totalEl.innerText = total;
      }

      function printReceipt() {
        if (cart.length === 0) { alert("購物車是空的！"); return; }
        const now = new Date();
        document.getElementById('printTime').innerText = now.toLocaleString('zh-TW', {hour12:false});
        let customerText = "現場客";
        if (currentCustomer) {
            customerText = currentCustomer.name === "手動輸入" ? currentCustomer.phone : `${currentCustomer.name || ''} ${currentCustomer.phone}`;
        }
        document.getElementById('printCustomer').innerText = customerText;
        let itemsHtml = '';
        let total = 0;
        cart.forEach(item => {
          total += item.price;
          itemsHtml += `<div class="receipt-item"><span>${item.name}</span><span>$${item.price}</span></div>`;
        });
        document.getElementById('printItems').innerHTML = itemsHtml;
        document.getElementById('printTotal').innerText = total;
        window.print();
      }

      window.onload = loadTodayCustomers;
    </script>
</body>
</html>
