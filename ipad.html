<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機台狀態顯示 (iPad版)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 兩欄佈局 */
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }

        .status-card {
            background-color: #1c1c1e;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            color: #8e8e93;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .label {
            color: #aeaeb2;
        }

        .value {
            font-weight: bold;
            color: #48484a; /* 預設灰階 (不亮燈狀態) */
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        /* 亮燈樣式 */
        .value.highlight {
            color: #fff;
            background-color: #0a84ff; /* 藍色亮燈 */
            box-shadow: 0 0 8px rgba(10, 132, 255, 0.5);
        }
        
        /* 針對付款方式的特殊亮燈顏色 (可選) */
        .value.highlight-pay {
            color: #fff;
            background-color: #30d158; /* 綠色亮燈 */
            box-shadow: 0 0 8px rgba(48, 209, 88, 0.5);
        }

        /* 機器編號樣式 */
        .machine-id {
            font-size: 32px;
            color: #fff;
            align-self: flex-end;
        }
    </style>
</head>
<body>

    <div class="status-card" id="washer-1">
        <div class="header">洗衣機 #01 <span class="machine-id">W01</span></div>
        
        <div class="info-row">
            <span class="label">消費方式</span>
            <span class="value" id="w1-payment">現金</span>
        </div>
        <div class="info-row">
            <span class="label">洗衣球</span>
            <span class="value" id="w1-pods">不加</span>
        </div>
        <div class="info-row">
            <span class="label">香香豆</span>
            <span class="value" id="w1-scent">否</span>
        </div>
         <div class="info-row">
            <span class="label">卡放店內</span>
            <span class="value" id="w1-card">否</span>
        </div>
        <div class="info-row">
            <span class="label">特約</span>
            <span class="value" id="w1-contract">否</span>
        </div>
    </div>

    <div class="status-card" id="dryer-1">
        <div class="header">烘衣機 #01 <span class="machine-id">D01</span></div>
        
        <div class="info-row">
            <span class="label">消費方式</span>
            <span class="value" id="d1-payment">電子支付</span>
        </div>
        <div class="info-row">
            <span class="label">溫度</span>
            <span class="value" id="d1-temp">中溫</span>
        </div>
        <div class="info-row">
            <span class="label">烘衣紙</span>
            <span class="value" id="d1-sheet">1盒</span>
        </div>
    </div>

    <script>
        // 模擬數據輸入 (實際情況會從後端或API獲取)
        // 這裡模擬原始數據，可能是英文或混合字串
        const mockData = {
            w1: {
                payment: "現金付款Cash", // 原始資料
                pods: "不加",
                scent: "是",
                card: "否",
                contract: "是"
            },
            d1: {
                payment: "電子支付E-Pay", // 原始資料
                temp: "中溫Middle",      // 測試: 改成 '低溫Low' 看效果
                sheet: "1盒One"
            }
        };

        // 文字簡化映射表
        const textMapping = {
            "低溫Low": "低溫",
            "高溫High": "高溫",
            "中溫Default": "中溫", // 假設原始資料有這個
            "電子支付E-Pay": "電子支付",
            "現金付款Cash": "現金",
            "儲值卡Card" : "儲值卡",
            "1盒One": "1盒",
            "2盒Two": "2盒",
            "3盒Three": "3盒",
            "不加Zero": "不加",
            "是Y": "是",
            "否N": "否"
        };

        function simplifyText(text) {
            // 如果在映射表中找到，就回傳簡化版，否則回傳原字串
            return textMapping[text] || text;
        }

        function updateUI() {
            // --- 洗衣機 W1 更新 ---
            updateField('w1-payment', mockData.w1.payment, 'payment');
            updateField('w1-pods', mockData.w1.pods, 'supply');
            updateField('w1-scent', mockData.w1.scent, 'option');
            updateField('w1-card', mockData.w1.card, 'option');
            updateField('w1-contract', mockData.w1.contract, 'option');

            // --- 烘衣機 D1 更新 ---
            updateField('d1-payment', mockData.d1.payment, 'payment');
            updateField('d1-temp', mockData.d1.temp, 'temp');
            updateField('d1-sheet', mockData.d1.sheet, 'supply');
        }

        // 通用更新函數：處理文字簡化 + 亮燈邏輯
        function updateField(elementId, rawValue, type) {
            const element = document.getElementById(elementId);
            const simpleText = simplifyText(rawValue);
            
            element.textContent = simpleText;
            
            // 重置樣式
            element.classList.remove('highlight', 'highlight-pay');

            // 亮燈邏輯判斷
            let shouldHighlight = false;

            if (type === 'payment') {
                // 消費方式：現金、電子支付 都亮燈
                if (simpleText === '現金' || simpleText === '電子支付') {
                    element.classList.add('highlight-pay'); // 用綠色區分支付
                    return; 
                }
            } else if (type === 'temp') {
                // 溫度：低溫、高溫(亮)，中溫(不亮)
                if (simpleText === '低溫' || simpleText === '高溫') {
                    shouldHighlight = true;
                }
            } else if (type === 'supply') {
                // 耗材：不加(不亮)，1盒/2盒/3盒(亮)
                // 只要不是 "不加" 且有內容通常就亮，或者明確比對
                if (simpleText !== '不加' && simpleText.includes('盒')) {
                    shouldHighlight = true;
                }
            } else if (type === 'option') {
                // 選項：是(亮)
                if (simpleText === '是') {
                    shouldHighlight = true;
                }
            }

            if (shouldHighlight) {
                element.classList.add('highlight');
            }
        }

        // 初始化
        updateUI();

        // 模擬動態變化 (3秒後改變部分數值以測試邏輯)
        setTimeout(() => {
            mockData.d1.temp = "低溫Low"; // 應該變亮
            mockData.d1.sheet = "不加";   // 應該變灰
            mockData.w1.pods = "2盒Two";  // 應該變亮並顯示 "2盒"
            updateUI();
        }, 3000);

    </script>
</body>
</html>
