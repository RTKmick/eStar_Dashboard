<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員管理系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <script src="config.js"></script>

  <style>
    body { background-color: #f8f9fa; padding: 20px; font-family: "Microsoft JhengHei", sans-serif; }
    
    .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    
    /* === 顏色配置 === */
    .header-add { background-color: #4e73df; color: white; font-weight: bold; border-radius: 15px 15px 0 0 !important; }
    .header-m { background-color: #6c757d; color: white; font-weight: bold; border-radius: 15px 15px 0 0 !important; } 
    .header-f { background-color: #5e2750; color: white; font-weight: bold; border-radius: 15px 15px 0 0 !important; } 
    
    /* 選擇按鈕 */
    .choice-btn {
      width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold;
      border: 2px solid #ddd; border-radius: 10px; transition: all 0.3s;
      background-color: white; color: #555;
    }
    .choice-btn:hover { background-color: #f1f1f1; }
    .choice-btn.active { border-color: #1cc88a; background-color: #e6fffa; color: #1cc88a; box-shadow: 0 0 10px rgba(28, 200, 138, 0.3); }
    .choice-btn.disabled-look { background-color: #e9ecef; color: #adb5bd; border-color: #dee2e6; cursor: not-allowed; opacity: 0.6; }

    /* 手動輸入區塊樣式 */
    .manual-box {
        border: 2px solid #ddd; border-radius: 10px; padding: 15px; transition: all 0.3s; background: #fff;
    }
    .manual-box.manual-active {
        border-color: #36b9cc; background-color: #f0fbfc; box-shadow: 0 0 10px rgba(54, 185, 204, 0.3);
    }
    .manual-box.disabled-look { background-color: #e9ecef; opacity: 0.6; pointer-events: none; }


    /* 表格設定 */
    .table-responsive { max-height: 600px; overflow-y: auto; } /* 恢復滾軸 */
    thead { position: sticky; top: 0; z-index: 10; }
    .table-m thead th { background-color: #e2e3e5; color: #383d41; }
    .table-f thead th { background-color: #f3e5f5; color: #4a148c; }
    
    /* === 客戶資料顯示區塊 === */
    #customerInfoBox {
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      display: none;
    }
    .info-label { font-weight: bold; color: #666; width: 100px; display: inline-block; }
    .info-val { color: #000; font-weight: bold; }
    .info-row { border-bottom: 1px dashed #ddd; padding: 4px 0; }
  </style>
</head>
<body>

  <div class="container-fluid">
    
    <div class="card">
      <div class="card-header header-add">➕ 新增會員 (Assign Member ID)</div>
      <div class="card-body">
        <div class="row g-4"> 
          
          <div class="col-md-5 border-end"> 
            <label for="phoneInput" class="form-label fw-bold">1. 輸入電話號碼</label>
            <div class="mb-3">
              <input type="tel" id="phoneInput" class="form-control form-control-lg" placeholder="例如：0912345678">
              
              <div class="d-flex justify-content-end mt-2">
                <button class="btn btn-primary px-4" type="button" onclick="checkPhone()">🔍 查詢與配號</button>
              </div>
            </div>

            <div id="customerInfoBox">
              <h5 class="text-primary border-bottom pb-2">👤 客戶資料 (CRM)</h5>
              <div class="info-row"><span class="info-label">手機號碼</span><span class="info-val" id="show-phone"></span></div>
              <div class="info-row"><span class="info-label">姓名</span><span class="info-val" id="show-name"></span></div>
              <div class="info-row"><span class="info-label">消費方式</span><span class="info-val" id="show-type"></span></div>
              <div class="info-row"><span class="info-label">烘衣溫度</span><span class="info-val" id="show-temp"></span></div>
              <div class="info-row"><span class="info-label">烘衣紙</span><span class="info-val" id="show-sheet"></span></div>
              <div class="info-row"><span class="info-label">洗衣球</span><span class="info-val" id="show-ball"></span></div>
              <div class="info-row"><span class="info-label">香香豆</span><span class="info-val" id="show-booster"></span></div>
              <div class="info-row"><span class="info-label">卡放店內</span><span class="info-val" id="show-card"></span></div>
              <div class="info-row bg-warning bg-opacity-25"><span class="info-label">會員編號</span><span class="info-val text-danger" id="show-id"></span></div>
              <div class="info-row"><span class="info-label">特約</span><span class="info-val" id="show-appointed"></span></div>
            </div>
          </div>
          
          <div class="col-md-7 d-flex flex-column justify-content-center">
            
            <label class="form-label text-center w-100 fw-bold">2. 選擇會員編號 (二選一)</label>
            <div class="row mb-3" id="choiceContainer" style="opacity: 0.5; pointer-events: none;">
              <div class="col-6"><button type="button" id="btnM" class="choice-btn" onclick="selectId('M')">M---</button></div>
              <div class="col-6"><button type="button" id="btnF" class="choice-btn" onclick="selectId('F')">F---</button></div>
            </div>

            <div id="manualContainer" class="manual-box mb-4" style="opacity: 0.5; pointer-events: none;" onclick="selectManual()">
                <label class="form-label fw-bold text-secondary w-100 text-center" style="cursor: pointer;">3. 手動輸入指定編號 (選填)</label>
                <div class="input-group">
                    <select class="form-select text-center fw-bold" id="manualPrefix" style="max-width: 80px; font-size: 1.2rem;" onchange="selectManual()">
                        <option value="M">M</option>
                        <option value="F" selected>F</option>
                    </select>
                    <input type="number" id="manualNumber" class="form-control text-center fw-bold" style="font-size: 1.2rem;" placeholder="輸入數字 (例如 52)" oninput="selectManual()" onfocus="selectManual()">
                </div>
            </div>
            
            <div class="d-flex flex-column align-items-end border-top pt-4">
              
              <div class="d-flex align-items-center mb-2">
                <div class="me-3">
                  <span id="statusMsg" class="text-danger fw-bold"></span>
                  <div class="spinner-border text-primary loading-spinner" id="mainSpinner" role="status" style="display:none;"></div>
                </div>
                <button id="btnAdd" class="btn btn-success px-4 py-2" disabled onclick="confirmAdd()">
                  ✅ 確認新增會員
                </button>
              </div>

              <button id="btnDelete" class="btn btn-outline-danger px-4 py-1 mt-2" style="display: none;" onclick="confirmDelete()">
                🗑️ 刪除會員資格
              </button>

            </div>

          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-6 col-12 mb-4">
        <div class="card h-100">
          <div class="card-header header-m d-flex justify-content-between align-items-center">
            <span>📋 M 系列會員</span>
            <button class="btn btn-sm btn-light text-dark fw-bold" onclick="forceRefresh()">🔄 重新整理 (同步)</button>
          </div>
          <div class="card-body p-0 table-responsive">
            <table class="table table-striped table-hover mb-0 table-m" id="tableM">
              <thead><tr><th>電話</th><th>姓名</th><th>編號</th><th>備註</th></tr></thead>
              <tbody><tr><td colspan="4" class="text-center p-3">載入中...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="card h-100">
          <div class="card-header header-f d-flex justify-content-between align-items-center">
            <span>📋 F 系列會員</span>
          </div>
          <div class="card-body p-0 table-responsive">
            <table class="table table-striped table-hover mb-0 table-f" id="tableF">
              <thead><tr><th>電話</th><th>姓名</th><th>編號</th><th>備註</th></tr></thead>
              <tbody><tr><td colspan="4" class="text-center p-3">載入中...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ✅ 2. API 設定區
    // ==========================================
    if (typeof CONFIG === 'undefined' || !CONFIG.API_URL) {
        alert("錯誤：找不到設定檔 config.js 或 API_URL 未設定！");
    }
    const GAS_API_URL = CONFIG.API_URL;

    // --- GitHub 專用：API 呼叫核心 ---
    function callApi(action, data = {}) {
        return fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({ action: action, data: data })
        })
        .then(res => {
            const contentType = res.headers.get("content-type");
            if (contentType && contentType.indexOf("application/json") !== -1) {
                return res.json();
            } else {
                throw new Error("伺服器回應非 JSON 格式 (可能是維護中或後端忙碌)");
            }
        })
        .then(result => {
            if(result.error) throw new Error(result.error);
            return result;
        });
    }
    
    // ==========================================
    // 邏輯區
    // ==========================================
    let currentSelection = null; 
    let nextIds = { M: '', F: '' };

    window.onload = function() { 
        showLoading(false);
        loadTable(); 
    };

    function loadTable() {
      const loadingHTML = '<tr><td colspan="4" class="text-center p-3">載入中...</td></tr>';
      document.querySelector('#tableM tbody').innerHTML = loadingHTML;
      document.querySelector('#tableF tbody').innerHTML = loadingHTML;
      
      callApi('getMembershipDisplayData')
        .then(renderTable)
        .catch(err => {
            console.error(err);
            document.querySelector('#tableM tbody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">載入失敗</td></tr>';
            document.querySelector('#tableF tbody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">載入失敗</td></tr>';
        });
    }

    function forceRefresh() {
      const loadingHTML = '<tr><td colspan="4" class="text-center p-3 text-primary fw-bold">♻️ 正在與 CRM 同步資料中，請稍候...</td></tr>';
      document.querySelector('#tableM tbody').innerHTML = loadingHTML;
      document.querySelector('#tableF tbody').innerHTML = loadingHTML;
      
      callApi('forceSyncAndGetData')
        .then(renderTable)
        .catch(err => {
            alert("同步失敗: " + err.message);
            loadTable(); 
        });
    }

    function renderTable(data) {
      const tbodyM = document.querySelector('#tableM tbody');
      const tbodyF = document.querySelector('#tableF tbody');
      tbodyM.innerHTML = ''; tbodyF.innerHTML = '';

      if (!data || data.length <= 1) {
        tbodyM.innerHTML = '<tr><td colspan="4" class="text-center">無資料</td></tr>';
        tbodyF.innerHTML = '<tr><td colspan="4" class="text-center">無資料</td></tr>';
        return;
      }

      for (let i = 1; i < data.length; i++) {
        const row = data[i];
        if (row[2] && String(row[2]).trim() !== "") {
          const tr = document.createElement('tr');
          [0, 1, 2, 3].forEach(idx => { const td = document.createElement('td'); td.textContent = row[idx]; tr.appendChild(td); });
          tbodyM.appendChild(tr);
        }
        if (row[7] && String(row[7]).trim() !== "") {
          const tr = document.createElement('tr');
          [5, 6, 7, 8].forEach(idx => { const td = document.createElement('td'); td.textContent = row[idx]; tr.appendChild(td); });
          tbodyF.appendChild(tr);
        }
      }
    }

    // 檢查電話
    function checkPhone() {
      const phone = document.getElementById('phoneInput').value.trim();
      if (phone.length < 8) { alert("請輸入正確的電話號碼！"); return; }

      showLoading(true);
      resetSelection();
      document.getElementById('customerInfoBox').style.display = 'none';
      
      // 重置刪除按鈕
      document.getElementById('btnDelete').style.display = 'none';
      document.getElementById('statusMsg').textContent = "查詢中...";

      callApi('checkPhoneAndGetNextIds', phone)
        .then(response => {
            showLoading(false);
            
            // 填入資料
            const c = response.customer;
            document.getElementById('show-phone').textContent = c.phone;
            document.getElementById('show-name').textContent = c.name;
            document.getElementById('show-type').textContent = c.type;
            document.getElementById('show-temp').textContent = c.temp;
            document.getElementById('show-sheet').textContent = c.sheet;
            document.getElementById('show-ball').textContent = c.ball;
            document.getElementById('show-booster').textContent = c.booster;
            document.getElementById('show-card').textContent = c.card;
            document.getElementById('show-id').textContent = c.memberId || "(尚未有編號)";
            document.getElementById('show-appointed').textContent = c.appointed;
            
            document.getElementById('customerInfoBox').style.display = 'block';

            if (response.hasId) {
                // === 舊會員：顯示已有編號，鎖定新增，顯示刪除 ===
                document.getElementById('statusMsg').textContent = `⚠️ 此客戶已有編號：${response.existingId}`;
                disableAllChoices(true); 
                document.getElementById('btnM').textContent = "已有編號";
                document.getElementById('btnF').textContent = response.existingId;
                
                // 鎖定確認新增
                document.getElementById('btnAdd').disabled = true;
                
                // 顯示刪除按鈕
                document.getElementById('btnDelete').style.display = 'inline-block';
            } else {
                // === 新會員：隱藏刪除，開放新增 ===
                document.getElementById('statusMsg').textContent = "客戶無編號，請選擇：";
                nextIds.M = response.nextM;
                nextIds.F = response.nextF;
                document.getElementById('btnM').textContent = response.nextM;
                document.getElementById('btnF').textContent = response.nextF;
                
                disableAllChoices(false);
                document.getElementById('btnDelete').style.display = 'none';
            }
        })
        .catch(err => {
            showLoading(false);
            document.getElementById('statusMsg').textContent = err.message;
            disableAllChoices(true);
            document.getElementById('btnDelete').style.display = 'none';
        });
    }

    // 控制自動與手動區塊的啟用狀態
    function disableAllChoices(disabled) {
      const autoContainer = document.getElementById('choiceContainer');
      const manualContainer = document.getElementById('manualContainer');
      const opacity = disabled ? '0.5' : '1';
      const pointer = disabled ? 'none' : 'auto';

      autoContainer.style.opacity = opacity; autoContainer.style.pointerEvents = pointer;
      manualContainer.style.opacity = opacity; manualContainer.style.pointerEvents = pointer;
      
      // 清空手動輸入框
      document.getElementById('manualNumber').value = '';
    }

    // 選擇自動編號 (M/F 按鈕)
    function selectId(type) {
      currentSelection = type;
      const btnM = document.getElementById('btnM');
      const btnF = document.getElementById('btnF');
      const manualBox = document.getElementById('manualContainer');

      // 重置樣式
      btnM.classList.remove('active', 'disabled-look');
      btnF.classList.remove('active', 'disabled-look');
      manualBox.classList.remove('manual-active'); // 移除手動區塊的高亮

      // 設定自動按鈕樣式
      if (type === 'M') { btnM.classList.add('active'); btnF.classList.add('disabled-look'); } 
      else { btnF.classList.add('active'); btnM.classList.add('disabled-look'); }
      
      document.getElementById('btnAdd').disabled = false;
    }

    // 選擇手動輸入 (當點擊手動區塊或輸入時觸發)
    function selectManual() {
      currentSelection = 'MANUAL';
      const btnM = document.getElementById('btnM');
      const btnF = document.getElementById('btnF');
      const manualBox = document.getElementById('manualContainer');

      // 讓上方自動按鈕變灰
      btnM.classList.remove('active');
      btnF.classList.remove('active');
      btnM.classList.add('disabled-look');
      btnF.classList.add('disabled-look');

      // 讓手動區塊變亮
      manualBox.classList.add('manual-active');

      document.getElementById('btnAdd').disabled = false;
    }

    function resetSelection() {
      currentSelection = null;
      document.getElementById('btnAdd').disabled = true;
      const btnM = document.getElementById('btnM');
      const btnF = document.getElementById('btnF');
      const manualBox = document.getElementById('manualContainer');
      
      btnM.classList.remove('active', 'disabled-look');
      btnF.classList.remove('active', 'disabled-look');
      manualBox.classList.remove('manual-active');
      
      btnM.textContent = "M---"; btnF.textContent = "F---";
      document.getElementById('manualNumber').value = '';
    }

    let loadingTimer = null;
    function showLoading(isLoading) {
      const sp = document.getElementById('mainSpinner');
      sp.style.display = isLoading ? 'inline-block' : 'none';

      if (isLoading) {
        clearTimeout(loadingTimer);
        loadingTimer = setTimeout(() => {
          sp.style.display = 'none';
          document.getElementById('statusMsg').textContent = "逾時：後端未回應，請稍後重試";
        }, 15000); 
      } else {
        clearTimeout(loadingTimer);
      }
    }

    // 確認新增
    function confirmAdd() {
      const phone = document.getElementById('phoneInput').value.trim();
      let selectedId = '';

      // 判斷是自動還是手動
      if (currentSelection === 'MANUAL') {
        const prefix = document.getElementById('manualPrefix').value;
        const number = document.getElementById('manualNumber').value.trim();
        if (!number) {
            alert("請輸入手動編號的數字部分！");
            document.getElementById('manualNumber').focus();
            return;
        }
        selectedId = prefix + number; // 例如 F + 52 = F52
      } else if (currentSelection === 'M') {
        selectedId = nextIds.M;
      } else if (currentSelection === 'F') {
        selectedId = nextIds.F;
      }
      
      if (!phone || !selectedId) return;
      if (!confirm(`確定要將電話 ${phone} 設定為會員 ${selectedId} 嗎？`)) return;

      showLoading(true);
      document.getElementById('btnAdd').disabled = true;
      document.getElementById('statusMsg').textContent = "寫入並整理資料中(約需3-5秒)...";

      callApi('addMemberIdToCRM', { phone: phone, id: selectedId })
        .then(response => {
            showLoading(false);
            if (response.success) {
                alert(response.message);
                document.getElementById('phoneInput').value = '';
                document.getElementById('customerInfoBox').style.display = 'none';
                resetSelection();
                disableAllChoices(true);
                document.getElementById('statusMsg').textContent = "";
                loadTable(); 
            } else {
                alert("錯誤：" + response.error);
                document.getElementById('btnAdd').disabled = false;
                document.getElementById('statusMsg').textContent = "發生錯誤，請重試";
            }
        })
        .catch(err => {
            showLoading(false);
            alert("系統發生錯誤：" + err.message);
            document.getElementById('btnAdd').disabled = false;
            document.getElementById('statusMsg').textContent = "連線錯誤";
        });
    }

    // 刪除會員
    function confirmDelete() {
      const phone = document.getElementById('show-phone').textContent;
      const currentId = document.getElementById('btnF').textContent; 

      if (!phone) return;

      if (!confirm(`⚠️ 警告：\n確定要刪除 ${phone} 的會員資格 (${currentId}) 嗎？\n\n刪除後該編號將變為空號，且不會影響目前的配號順序。`)) {
        return;
      }

      showLoading(true);
      document.getElementById('btnAdd').disabled = true;
      document.getElementById('btnDelete').disabled = true;
      document.getElementById('statusMsg').textContent = "刪除資料中...";

      callApi('deleteMemberFromCRM', { phone: phone })
        .then(response => {
            showLoading(false);
            document.getElementById('btnDelete').disabled = false;

            if (response.success) {
                alert(response.message);
                document.getElementById('phoneInput').value = '';
                document.getElementById('customerInfoBox').style.display = 'none';
                document.getElementById('btnDelete').style.display = 'none'; 
                resetSelection();
                disableAllChoices(true);
                document.getElementById('statusMsg').textContent = "";
                loadTable(); 
            } else {
                alert("錯誤：" + response.error);
                document.getElementById('statusMsg').textContent = "刪除失敗";
            }
        })
        .catch(err => {
            showLoading(false);
            document.getElementById('btnDelete').disabled = false;
            alert("系統發生錯誤：" + err.message);
            document.getElementById('statusMsg').textContent = "連線錯誤";
        });
    }
  </script>
</body>
</html>
